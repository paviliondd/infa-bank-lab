---
ansible_user: root
ansible_ssh_private_key_file: /home/gitlab-runner/.ssh/id_ed25519
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

# Vault integration
vault_url: "http://automation.bank-infra.lab:8200"
firewall_use_vault: true

# Bank firewall zones (reference only)
bank_zones:
  mgmt:
    subnets:
      - "103.110.85.93/32"   # VPS 1 gitlab
      - "103.110.85.105/32"  # VPS 6 netlab
  internal:
    subnets:
      - "116.118.51.79/32"   # VPS 4
      - "103.110.85.124/32"  # VPS 5
  dmz:
    subnets:
      - "116.118.50.73/32"   # VPS 3

# Default firewall rules (SSH rules now from Vault)
bank_firewall_rules:
  - name: allow-http
    protocol: tcp
    port: 80
    source: "0.0.0.0/0"
    action: ACCEPT
    comment: "Allow HTTP"

  - name: allow-https
    protocol: tcp
    port: 443
    source: "0.0.0.0/0"
    action: ACCEPT
    comment: "Allow HTTPS"

  - name: allow-internal-all
    protocol: all
    port: ""
    source: "116.118.48.0/23"
    action: ACCEPT
    comment: "Allow internal network"

  - name: allow-established
    protocol: all
    port: ""
    source: "0.0.0.0/0"
    action: ACCEPT
    extra_args: "-m state --state ESTABLISHED,RELATED"
    comment: "Allow established connections"

# Backup
firewall_backup_dir: /etc/iptables/backup
