frr version 8.5
frr defaults traditional
hostname sw1
log syslog informational
no ipv6 forwarding

interface eth1
 description link-to-sw2
 ip address 10.0.12.1/30
!
interface eth2
 description link-to-router1
 ip address 10.0.13.1/30
!
interface lo
 ip address 10.255.255.11/32
!

! VLANs simulation via IP subinterfaces
! VLAN 10 - Management
! VLAN 20 - Internal Banking
! VLAN 30 - DMZ

ip route 0.0.0.0/0 10.0.13.2

line vty
!
end
