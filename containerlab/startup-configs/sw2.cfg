frr version 8.5
frr defaults traditional
hostname sw2
log syslog informational
no ipv6 forwarding

interface eth1
 description link-to-sw1
 ip address 10.0.12.2/30
!
interface eth2
 description link-to-router1
 ip address 10.0.14.1/30
!
interface lo
 ip address 10.255.255.12/32
!

ip route 0.0.0.0/0 10.0.14.2

line vty
!
end
