frr version 8.5
frr defaults traditional
hostname router1
log syslog informational
no ipv6 forwarding

interface eth1
 description link-to-sw1
 ip address 10.0.13.2/30
!
interface eth2
 description link-to-sw2
 ip address 10.0.14.2/30
!
interface lo
 ip address 10.255.255.13/32
!

! Static routing for lab
ip route 10.255.255.11/32 10.0.13.1
ip route 10.255.255.12/32 10.0.14.1

line vty
!
end
