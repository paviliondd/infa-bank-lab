stages:
  - lint
  - validate
  - deploy-ci
  - deploy-staging
  - test-connectivity
  - deploy-prod
  - network-dr-schedule

variables:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_STDOUT_CALLBACK: "default"
  ANSIBLE_DEPRECATION_WARNINGS: "False"
  VAULT_ADDR: "http://103.110.85.98:8200"
  NETLAB_HOST: "netlab.bank"
  ANSIBLE_ROLES_PATH: "${CI_PROJECT_DIR}/roles"
  ANSIBLE_COLLECTIONS_PATH: "${CI_PROJECT_DIR}/collections"
  ANSIBLE_CONFIG: "${CI_PROJECT_DIR}/ansible.cfg"

default:
  before_script:
    - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

# ─────────────── LINT ───────────────
lint:ansible:
  stage: lint
  script:
    - ansible --version
    - ansible-galaxy collection install -r collections/requirements.yml --force
    - ansible-lint playbooks/ roles/
  allow_failure: false

lint:yaml:
  stage: lint
  script:
    - yamllint -d relaxed inventories/ playbooks/ roles/ || true
  allow_failure: true

# ─────────────── VALIDATE ───────────────
validate:syntax:
  stage: validate
  needs:
    - lint:ansible
  script:
    - ansible-playbook playbooks/network/vlan-config.yml
        --inventory inventories/staging/network.yml
        --syntax-check
    - ansible-playbook playbooks/firewall/firewall-rules.yml
        --inventory inventories/staging/servers.yml
        --syntax-check
    - echo "All syntax checks passed"

validate:dry-run:
  stage: validate
  needs:
    - validate:syntax
  script:
    - ansible-playbook playbooks/network/vlan-config.yml
        --inventory inventories/staging/network.yml
        --check --diff
        || echo "Dry-run vlan complete"
    - ansible-playbook playbooks/firewall/firewall-rules.yml
        --inventory inventories/staging/servers.yml
        --check --diff
        || echo "Dry-run firewall complete"

# ─────────────── DEPLOY CI ───────────────
deploy:jenkins:
  stage: deploy-ci
  when: manual
  script:
    - echo "Deploying Jenkins CI Server on VPS 1"
    - ansible-playbook playbooks/ci/jenkins-setup.yml
    - echo "Jenkins deployed successfully"

# ─────────────── DEPLOY STAGING ───────────────
deploy:vlan-staging:
  stage: deploy-staging
  needs:
    - validate:dry-run
  environment:
    name: staging/network
  script:
    - mkdir -p backups/vlan
    - echo "Lab 1.1 - VLAN deploy - Pipeline ${CI_PIPELINE_ID}"
    - ansible-playbook playbooks/network/vlan-config.yml
        --inventory inventories/staging/network.yml
        --diff
        -e "env=staging"
    - echo "VLAN staging complete"
  artifacts:
    paths:
      - backups/
    expire_in: 7 days
    when: always

deploy:firewall-staging:
  stage: deploy-staging
  needs:
    - validate:dry-run
  environment:
    name: staging/firewall
  script:
    - mkdir -p backups/firewall backups/audit
    - echo "Lab 1.2 - Firewall deploy - Pipeline ${CI_PIPELINE_ID}"
    - ansible-playbook playbooks/firewall/firewall-rules.yml
        --inventory inventories/staging/servers.yml
        --diff
        -e "env=staging"
    - echo "Firewall staging complete"
  artifacts:
    paths:
      - backups/
    expire_in: 7 days
    when: always

rollback:vlan-staging:
  stage: deploy-staging
  when: manual
  script:
    - ansible-playbook playbooks/network/vlan-rollback.yml
        --inventory inventories/staging/network.yml
        -e "rollback_epoch=${ROLLBACK_EPOCH}"

rollback:firewall-staging:
  stage: deploy-staging
  when: manual
  script:
    - ansible-playbook playbooks/firewall/firewall-rollback.yml
        --inventory inventories/staging/servers.yml
        -e "rollback_epoch=${ROLLBACK_EPOCH}"

# ─────────────── TEST CONNECTIVITY ───────────────
test:firewall-connectivity:
  stage: test-connectivity
  needs:
    - deploy:firewall-staging
  script:
    - echo "=== Test Connectivity — Post Firewall Deploy ==="
    - echo "--- SSH from Runner to all servers ---"
    - |
      PASS=0; FAIL=0
      for HOST in 116.118.50.73 116.118.51.79 103.110.85.124; do
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes root@$HOST "echo SSH_OK" 2>/dev/null; then
          echo "  ✅ SSH to $HOST — OK"
          PASS=$((PASS+1))
        else
          echo "  ❌ SSH to $HOST — FAILED"
          FAIL=$((FAIL+1))
        fi
      done
    - echo "--- HTTP/HTTPS port check ---"
    - |
      for HOST in 116.118.50.73 116.118.51.79 103.110.85.124; do
        for PORT in 80 443; do
          if timeout 3 bash -c "echo >/dev/tcp/$HOST/$PORT" 2>/dev/null; then
            echo "  ✅ Port $PORT on $HOST — OPEN"
          else
            echo "  ⚠️  Port $PORT on $HOST — CLOSED/FILTERED (may be expected)"
          fi
        done
      done
    - echo "--- ICMP ping check ---"
    - |
      for HOST in 116.118.50.73 116.118.51.79 103.110.85.124; do
        if ping -c 2 -W 3 $HOST >/dev/null 2>&1; then
          echo "  ✅ Ping $HOST — OK"
        else
          echo "  ❌ Ping $HOST — FAILED"
        fi
      done
    - echo "--- Verify iptables rules on remote ---"
    - ansible -i inventories/staging/servers.yml linux_servers
        -m shell -a "iptables -L INPUT -n --line-numbers | head -20"
    - echo "=== Connectivity tests complete ==="
  allow_failure: false

# ─────────────── DEPLOY PRODUCTION ───────────────
deploy:vlan-production:
  stage: deploy-prod
  needs:
    - deploy:vlan-staging
  environment:
    name: production/network
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - echo "PRODUCTION VLAN - Operator ${GITLAB_USER_LOGIN}"
    - ansible-playbook playbooks/network/vlan-config.yml
        --inventory inventories/production/network.yml
        --diff
    - echo "VLAN production complete"

deploy:firewall-production:
  stage: deploy-prod
  needs:
    - test:firewall-connectivity
  environment:
    name: production/firewall
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - mkdir -p backups/firewall backups/audit
    - echo "PRODUCTION FIREWALL - Operator ${GITLAB_USER_LOGIN}"
    - ansible-playbook playbooks/firewall/firewall-rules.yml
        --inventory inventories/production/servers.yml
        --diff
    - echo "Firewall production complete"
  artifacts:
    paths:
      - backups/
    expire_in: 30 days
    when: always

# ─────────────── BACKUP DR (SCHEDULED) ───────────────
auto_network_backup:
  stage: network-dr-schedule
  tags:
    - network-runner
  script:
    - echo "Khởi chạy Ansible hút config hạ tầng..."
    - cd dr_backup 
    - ansible-playbook -i ../inventories/staging/network.yml ansible_backup.yml
  artifacts:
    paths:
      - dr_backup/backups/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ===== LAB 2.3: IaC SECURITY SCANNING =====

tfsec:
  stage: lint
  image: aquasec/tfsec:latest
  script:
    - echo "==> Scanning Terraform code with tfsec..."
    - tfsec . --minimum-severity HIGH --format lovely
  allow_failure: false
  rules:
    - changes:
        - "**/*.tf"

trivy-iac:
  stage: lint
  image: aquasec/trivy:latest
  script:
    - echo "==> Scanning IaC files with Trivy (replaces Checkov)..."
    - trivy config . --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true
  rules:
    - changes:
        - "**/*.tf"
        - "**/*.yml"
        - "**/*.yaml"

ansible-lint:
  stage: lint
  script:
    - echo "==> Linting Ansible code with ansible-lint..."
    - ansible-lint playbooks/ roles/ collections/
        --warn-list yaml[truthy]
        --exclude .git
  allow_failure: false
  rules:
    - changes:
        - "**/*.yml"
        - "**/*.yaml"
