---
- name: Ensure Jenkins config directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/jenkins_data"
    state: directory
    mode: "0777"

- name: Create docker-compose for Jenkins
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/jenkins_data/docker-compose.yml"
    mode: "0644"
    content: |
      version: '3.8'
      services:
        jenkins:
          image: "jenkins/jenkins:lts"
          container_name: "jenkins-master"
          user: root
          restart: "unless-stopped"
          privileged: true
          ports:
            - "8080:8080"
            - "50000:50000"
          volumes:
            - "jenkins_home:/var/jenkins_home"
            - "/var/run/docker.sock:/var/run/docker.sock"
      volumes:
        jenkins_home:

- name: Deploy Jenkins with docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ lookup('env', 'HOME') }}/jenkins_data"
    state: present
    recreate: auto
