---
# ──────────────────────────────────────────────
# bank_firewall role — main entry point
# ──────────────────────────────────────────────
# Step 1: Vault AppRole — fetch SSH whitelist
- name: Include Vault authentication
  ansible.builtin.include_tasks: vault.yml
  tags: [always]

# Step 2: Backup current rules
- name: Include backup tasks
  ansible.builtin.include_tasks: backup.yml
  tags: [backup]

# Step 3: Generate, validate, apply
- name: Include apply tasks
  ansible.builtin.include_tasks: apply.yml
  tags: [firewall]

# Step 4: Verify SSH + auto-rollback
- name: Include verify tasks
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]

# Step 5: Audit log + cleanup
- name: Include audit tasks
  ansible.builtin.include_tasks: audit.yml
  tags: [audit]
