---
- name: Thêm Repository của Kubernetes NGINX Ingress
  command: /usr/local/bin/helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Cập nhật Helm Repo Ingress
  command: /usr/local/bin/helm repo update
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Triển khai NGINX Ingress Controller dạng Bare-Metal
  command: >
    /usr/local/bin/helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
    --namespace ingress-nginx --create-namespace
    --set controller.hostNetwork=true
    --set controller.kind=DaemonSet
    --set controller.nodeSelector."kubernetes\.io/os"=linux
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Mở cổng 80 cho web traffic nội bộ (iptables)
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 80
    jump: ACCEPT
  ignore_errors: true

- name: Mở cổng 443 cho web traffic mã hoá (HTTPS)
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 443
    jump: ACCEPT
  ignore_errors: true

- name: Lưu cấu hình tường lửa Ingress (Chống rớt cổng sau khi khởi động lại)
  shell: netfilter-persistent save || iptables-save > /etc/iptables/rules.v4
  changed_when: false
  ignore_errors: true
