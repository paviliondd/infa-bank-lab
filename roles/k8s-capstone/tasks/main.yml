---
- name: Ensure banking-prod namespace exists
  command: kubectl apply -f {{ role_path }}/files/k8s/namespace.yaml

- name: Deploy Bank Portal Application
  command: kubectl apply -f {{ role_path }}/files/k8s/deployment.yaml

- name: Deploy Bank Portal Service & Ingress
  command: kubectl apply -f {{ role_path }}/files/k8s/service-ingress.yaml

- name: Deploy Bank Portal ServiceMonitor (Prometheus)
  command: kubectl apply -f {{ role_path }}/files/k8s/monitoring.yaml
