apiVersion: v1
kind: Service
metadata:
  name: bank-portal-svc
  namespace: banking-prod
  labels:
    app: bank-portal
    component: web-frontend
spec:
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: bank-portal
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-portal-ingress
  namespace: banking-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-dns01"
spec:
  tls:
  - hosts:
    - bank.linuxunity.com
    secretName: bank-tls-secret
  rules:
  - host: bank.linuxunity.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-portal-svc
            port:
              number: 80
