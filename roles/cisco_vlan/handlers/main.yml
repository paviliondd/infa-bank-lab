---
- name: Restart frr
  ansible.builtin.shell:
    cmd: "pkill -f frr || true && sleep 2 && /usr/lib/frr/frrinit.sh start || true"
  changed_when: true
  listen: restart frr

- name: Reload frr
  ansible.builtin.shell:
    cmd: "/usr/lib/frr/frr-reload.py /etc/frr/frr.conf || true"
  changed_when: true
  listen: reload frr
