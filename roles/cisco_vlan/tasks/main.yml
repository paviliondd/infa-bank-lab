---
- name: Gather current interface facts
  ansible.builtin.setup:
    gather_subset:
      - network
  tags: [always]

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0755"
  tags: [backup]

- name: Backup current FRR config before change
  ansible.builtin.fetch:
    src: /etc/frr/frr.conf
    dest: "backups/pre-deploy/{{ inventory_hostname }}-{{ ansible_date_time.epoch }}.conf"
    flat: true
  ignore_errors: true
  tags: [backup]

- name: Ensure FRR daemon config exists
  ansible.builtin.template:
    src: daemons.j2
    dest: /etc/frr/daemons
    owner: frr
    group: frr
    mode: "0640"
  tags: [config]

- name: Write new FRR config to temp location
  template:
    src: vlan.j2
    dest: /tmp/frr-new.conf
    mode: '0640'
  tags: [config]

- name: Apply FRR config via frr-reload (no file lock issue)
  shell: |
    if [ -f /usr/lib/frr/frr-reload.py ]; then
      python3 /usr/lib/frr/frr-reload.py --reload /tmp/frr-new.conf
    else
      cp /tmp/frr-new.conf /etc/frr/frr.conf
      vtysh -c "write memory"
    fi
  register: frr_reload_result
  changed_when: "'No changes' not in frr_reload_result.stdout"
  tags: [config]

- name: Show reload result
  debug:
    msg: "{{ frr_reload_result.stdout_lines }}"
  tags: [config]


- name: Verify FRR config syntax before reload
  command: >
    vtysh -C -f /etc/frr/frr.conf
  changed_when: false
  tags: [validate]

- name: Force reload FRR if config changed
  command: /usr/lib/frr/frr-reload.py --reload /etc/frr/frr.conf
  when: ansible_check_mode is not defined or not ansible_check_mode
  ignore_errors: true
  tags: [config]


- name: Wait for FRR to start
  ansible.builtin.pause:
    seconds: 3
  tags: [config, vlan]

- name: Verify interfaces are up
  ansible.builtin.command:
    cmd: ip link show
  register: cisco_vlan_interface_status
  changed_when: false
  tags: [verify]

- name: Assert eth0 exists
  ansible.builtin.assert:
    that:
      - "'eth0' in cisco_vlan_interface_status.stdout"
    fail_msg: "Interface check failed on {{ inventory_hostname }}"
    success_msg: "All interfaces OK on {{ inventory_hostname }}"
  tags: [verify]

- name: Save config snapshot
  ansible.builtin.copy:
    content: "{{ lookup('file', '/etc/frr/frr.conf') }}"
    dest: "/tmp/backup/{{ inventory_hostname }}-{{ ansible_date_time.date }}.conf"
    mode: "0644"
  tags: [backup]

- name: Log change to audit file
  ansible.builtin.lineinfile:
    path: /var/log/ansible-audit.log
    line: >-
      {{ ansible_date_time.iso8601 }} | {{ inventory_hostname }} | vlan-config |
      user={{ lookup('env', 'GITLAB_USER_LOGIN') | default('pipeline', true) }}
    create: true
    mode: "0644"
  tags: [audit]
